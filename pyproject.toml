[project]
name = "thai-nlp-sql"
version = "0.1.0"
description = "Thai NLP-to-SQL Agent with RAG and multi-provider LLM support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "sqlalchemy",
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "langchain-openai",
    "langchain-google-genai",

    "pymysql",
    "psycopg2-binary",

    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",

    "sqlglot>=23.0.0",

    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",

    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Bare `pytest` must collect the suite only; scripts/ holds ad-hoc verification
# scripts whose import-time side effects break the tests when collected.
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# The lint gate covers the service, its evaluation and its tests. scripts/ and
# examples/ are one-off developer utilities, not shipped code.
extend-exclude = ["scripts", "examples"]

[tool.ruff.lint]
# Defect-catching core rules: syntax errors, undefined names, duplicate
# definitions, unused imports/variables. Style rules stay off on purpose —
# E501 fights the long SQL strings, and E402 is unavoidable where a test sets
# environment variables before importing the app.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E402"]
